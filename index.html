<!DOCTYPE html>
<html>

<title>Weather App</title>
<head>
  <link rel="stylesheet" href="styles/weather.css"> 
</head>
<body>
  <h1>Weather App</h1>
    <div>
      <input class="area-search js-area-search"  type="text" placeholder="Enter Area Name">
      <button class="search-button js-search-button">Search</button>
      <div>
      <span>Your City:</span>
      <span class="city-name js-city-name"></span>
      </div>
    </div>

<div class="weather-container js-weather-container">
     <div>
      <span>Time =</span>
      <span class="time js-time"></span>

    </div>
    <div>
      <span>Temperature =</span>
      <span class="temperature js-temperature"></span>
    </div>
    <div>
      <span>Wind Speed =</span>
      <span class="wind-speed js-wind-speed"></span>

    </div>
    <div>
      <span>Humidity =</span>
      <span class="humidity js-humidity"></span>

    </div>
</div>  
  <script type="module" src="scripts/weather.js">
  </script>
</body>
</html>
