<!DOCTYPE html>
<html>

<head>
  
  <title>Weather App</title>
  <link rel="stylesheet" href="styles/weather.css"> 
</head>
<body>

      <span class="city-name js-city-name"></span>
    </div> 

<div class="weather-container js-weather-container">

      <span>Wind Speed =</span>

    <div>
      <span>Humidity =</span>

    </div>
</div>  
  <script type="module" src="scripts/weather.js">
  </script>

</html>
